name: Task 3 Validation

on:
  push:
    branches:
      - task-3-print-bridge
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - name: Test local print bridge
        run: npm run test:print-bridge
      - name: Build POS
        run: npm run build
